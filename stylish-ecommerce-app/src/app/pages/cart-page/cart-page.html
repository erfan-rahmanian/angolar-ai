<div class="cart-page-container fade-in">
  <h2>Your Shopping Cart</h2>

  <div *ngIf="(cartItems$ | async)?.length === 0; else cartHasItems" class="cart-empty">
    <p>Your cart is currently empty.</p>
    <a routerLink="/products" class="btn">Continue Shopping</a>
  </div>

  <ng-template #cartHasItems>
    <div class="cart-summary" *ngIf="(cartTotal$ | async) as total">
      <h3>Total: {{ total | currency:'USD':'symbol' }}</h3>
      <button class="btn btn-checkout" (click)="proceedToCheckout()">Proceed to Checkout</button>
      <button class="btn btn-clear" (click)="clearCart()">Clear Cart</button>
    </div>

    <div class="cart-items-list">
      <div *ngFor="let item of (cartItems$ | async)" class="cart-item">
        <img [src]="item.product.image" [alt]="item.product.title" class="cart-item-image">
        <div class="cart-item-details">
          <h4 class="cart-item-title">{{ item.product.title }}</h4>
          <p class="cart-item-price">{{ item.product.price | currency:'USD':'symbol' }}</p>
        </div>
        <div class="cart-item-actions">
          <label for="quantity-{{item.product.id}}">Qty:</label>
          <input
            type="number"
            id="quantity-{{item.product.id}}"
            [value]="item.quantity"
            (change)="updateItemQuantity(item.product.id, $event)"
            min="1"
            class="quantity-input">
          <button class="btn-remove" (click)="removeItem(item.product.id)">Remove</button>
        </div>
        <div class="cart-item-subtotal">
          Subtotal: {{ (item.product.price * item.quantity) | currency:'USD':'symbol' }}
        </div>
      </div>
    </div>
  </ng-template>
</div>
