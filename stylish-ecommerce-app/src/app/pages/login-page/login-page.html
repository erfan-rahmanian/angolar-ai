<div class="auth-container fade-in">
  <h2>Login</h2>
  <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)">
    <div class="form-group">
      <label for="email">Email or Username</label>
      <input type="text" id="email" name="email" class="form-control" ngModel required #emailInput="ngModel">
      <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="alert alert-danger">
        Email/Username is required.
      </div>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" ngModel required #passwordInput="ngModel">
      <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)" class="alert alert-danger">
        Password is required.
      </div>
    </div>
    <button type="submit" class="btn auth-btn" [disabled]="loginForm.invalid">Login</button>
  </form>
  <p class="auth-switch">
    Don't have an account? <a routerLink="/register">Register here</a>
  </p>
</div>
