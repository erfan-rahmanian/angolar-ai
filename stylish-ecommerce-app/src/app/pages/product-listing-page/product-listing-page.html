<div class="product-listing-container fade-in">
  <h2>Our Products</h2>
  <div *ngIf="isLoading" class="loading-indicator">
    <div class="spinner"></div>
    <p>Loading products...</p>
    <!-- Add a nice spinner/animation later -->
  </div>

  <div *ngIf="error" class="error-message">
    <p>Sorry, we couldn't load products at this time. Please try again later.</p>
    <p>Error: {{ error }}</p>
  </div>

  <div *ngIf="!isLoading && !error && products.length === 0" class="empty-message">
    <p>No products found.</p>
  </div>

  <div class="products-grid" *ngIf="!isLoading && !error && products.length > 0">
    <app-product-card
      *ngFor="let product of products"
      [product]="product"
      (addToCart)="handleAddToCart($event)">
    </app-product-card>
  </div>
</div>
